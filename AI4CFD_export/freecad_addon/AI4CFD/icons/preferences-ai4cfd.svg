<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0a1a50"/>
    </linearGradient>
    <linearGradient id="airfoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0097a7;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="11" fill="url(#bg)"/>

  <!-- Streamlines left -->
  <line x1="4"  y1="14" x2="16" y2="14" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="4"  y1="20" x2="13" y2="20" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  <line x1="4"  y1="44" x2="16" y2="44" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="4"  y1="38" x2="13" y2="38" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>

  <!-- Streamlines right -->
  <line x1="48" y1="14" x2="60" y2="14" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="51" y1="20" x2="60" y2="20" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  <line x1="48" y1="44" x2="60" y2="44" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="51" y1="38" x2="60" y2="38" stroke="#4dd0e1" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>

  <!-- Airfoil / pipe silhouette glow -->
  <ellipse cx="32" cy="29" rx="18" ry="7" fill="url(#airfoil)" opacity="0.45"/>

  <!-- "AI" — large bold white -->
  <text x="32" y="32"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="23"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">AI</text>

  <!-- Divider -->
  <line x1="10" y1="43" x2="54" y2="43" stroke="#4dd0e1" stroke-width="0.9" opacity="0.45"/>

  <!-- "4CFD" — teal accent -->
  <text x="32" y="54"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="11"
        fill="#4dd0e1"
        text-anchor="middle"
        letter-spacing="1">4CFD</text>
</svg>
